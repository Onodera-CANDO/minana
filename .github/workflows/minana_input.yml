name: Minana Input Handler

on:
  repository_dispatch:
    types: [minana_input]

jobs:
  handle-input:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Handle input and send reply
        env:
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: npm run handle-input

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/minana.csv
          git diff --staged --quiet || (git commit -m "chore: update minana.csv" && git push)
