name: People Memory Pages

# people-memory を本番ビルドして gh-pages ブランチへ配置する（GitHub Pages 用）
# 初回のみ: Settings → Pages → Source「Deploy from a branch」→ gh-pages / (root)
on:
  push:
    branches: [ccr-5ea79dfa-c1r9xv]
    paths:
      - "people-memory/**"
      - ".github/workflows/people-memory-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: people-memory-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: people-memory/package-lock.json

      - name: Build
        working-directory: people-memory
        run: |
          npm ci
          npm test
          npm run build
          touch dist/.nojekyll

      - name: Push to gh-pages
        working-directory: people-memory/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy people-memory ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
