name: Minana Morning Report

on:
  schedule:
    # 毎朝 7:00 JST (UTC 22:00)
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  send-morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Send morning report
        env:
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: npm run send-morning
